name: Feature request
description: Suggest an improvement to Ravenshelf.
title: '[Feature]: '
body:
  - type: textarea
    id: need
    attributes:
      label: What would this help you do?
      description: Describe the problem or task in your own words.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain how you would expect the feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
      description: Optional. Please omit private account details and signed download URLs.
